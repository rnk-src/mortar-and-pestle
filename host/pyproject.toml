[project]
name = "mortar-pestle"
version = "0.1.0"
description = "Host software for the assistive teleoperated mortar and pestle"
requires-python = ">=3.12"
dependencies = [
    "pybullet>=3.2.7",
]

[project.scripts]
mortar-pestle = "mortar_pestle.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortar_pestle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyBullet has no wheel for Apple Silicon. Its bundled zlib defines an fdopen
# macro that breaks against current macOS SDKs; this flag disables the macro.
[tool.uv.extra-build-variables]
pybullet = { CFLAGS = "-Dfdopen=fdopen" }

[[tool.mypy.overrides]]
module = ["pybullet", "pybullet_data"]
ignore_missing_imports = true
