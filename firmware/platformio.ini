; Leader firmware.
; lib/core is hardware-free and is tested on the host with env:native.
; src/ holds the Arduino adapters and builds only for env:esp32dev.
; lib/core must stay valid C++17: native builds with c++17, the Arduino core sets its own newer standard.

[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = test_native
